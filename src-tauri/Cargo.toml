[package]
name = "spell"
version = "1.1.4"
description = "An offline markdown-based notes app"
authors = ["666base"]
repository = "https://github.com/666base/spell"
edition = "2021"

[lib]
name = "spell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.8.0"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
tauri-plugin-deep-link = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
anyhow = "1"
notify = "6"
tantivy = "0.22"
tokio = { version = "1", features = ["fs", "sync", "time"] }
base64 = "0.22"
url = "2"
urlencoding = "2"
open = "5"
regex = "1"
walkdir = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
chrono = "0.4"
